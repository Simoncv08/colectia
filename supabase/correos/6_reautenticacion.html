<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu código de verificación</title>
</head>
<body style="margin:0;padding:0;background:#f7f8fa;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fa;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td style="padding:0 0 16px;">
              <img src="https://www.colectia.org/colectia-abeja-correo.png" width="28" height="28" alt="" style="display:inline-block;width:28px;height:28px;border:0;vertical-align:middle;">
              <span style="font-size:18px;font-weight:700;color:#0f172a;vertical-align:middle;">&nbsp;Colectia</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border:1px solid #e4e7ec;border-radius:16px;padding:32px 24px;">
          <h1 style="margin:0 0 16px;font-size:22px;line-height:30px;font-weight:700;color:#0f172a;">Tu código de verificación</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:24px;color:#344054;">Hola,</p>
          <p style="margin:0 0 16px;font-size:15px;line-height:24px;color:#344054;">Usa este código para confirmar que eres tú en Colectia:</p>
          <p style="margin:8px 0 24px;font-size:32px;line-height:40px;font-weight:700;letter-spacing:6px;color:#0f172a;">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:20px;color:#475467;">Si no lo pediste, ignora este correo.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 8px 0;font-size:12px;line-height:18px;color:#475467;text-align:center;">
              Colectia · Pagos escolares claros para familias y colegios.<br>
              Recibiste este correo porque alguien usó esta dirección en Colectia.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
